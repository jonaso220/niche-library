<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Niche Library — Tu Colección de Fragancias</title>
    <meta name="description" content="Organiza tu colección de perfumes por temporada, horario y ocasión. Busca, categoriza y gestiona tus fragancias favoritas." />

    <!-- Favicons -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Theme color: verde esmeralda oscuro del ícono -->
    <meta name="theme-color" content="#1a3d2e" />
    <meta name="msapplication-TileColor" content="#1a3d2e" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Niche Library" />

    <!-- Open Graph -->
    <meta property="og:title" content="Niche Library — Tu Colección de Fragancias" />
    <meta property="og:description" content="Organiza tu colección de perfumes por temporada, horario y ocasión." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:alt" content="Niche Library — catálogo personal de perfumes" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Niche Library" />
    <meta property="og:locale" content="es_ES" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Niche Library — Tu Colección de Fragancias" />
    <meta name="twitter:description" content="Organiza tu colección de perfumes por temporada, horario y ocasión." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Web App Manifest -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Structured data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Niche Library",
        "description": "Organiza tu colección de perfumes por temporada, horario y ocasión. Busca entre 59 000+ fragancias, gestiona tu inventario y sincroniza en la nube.",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "Web",
        "inLanguage": "es",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
